# lv built-in configuration.
#
# This file is embedded in the binary and parsed before any user config, so
# everything here can be overridden by name. `lv --dump-config` prints the
# result of merging this with your own file.
#
# Regular expressions are single-quoted: single quotes disable escape
# processing, and braces and a leading # would otherwise be syntax.

# ---------------------------------------------------------------- key bindings
#
# The default map is vi's. Motions move a cursor and the window follows, counts
# work (5j, 42G), and gg/zz-style sequences are written as they are in vim.
# Everything here can be replaced by name in your own config.

# motions
bind h            left
bind l            right
bind j            down
bind k            up
bind <Down>       down
bind <Up>         up
bind <Left>       left
bind <Right>      right
bind w            word-forward
bind b            word-back
bind e            word-end
bind 0            line-start
bind ^            line-first
bind $            line-end
bind gg           goto-start
bind G            goto-end
bind <Home>       goto-start
bind <End>        goto-end
bind H            screen-top
bind M            screen-middle
bind L            screen-bottom
bind <C-e>        scroll-down
bind <C-y>        scroll-up
bind <C-d>        half-page-down
bind <C-u>        half-page-up
bind <C-f>        page-down
bind <C-b>        page-up
bind <Space>      page-down
bind <PgDn>       page-down
bind <PgUp>       page-up
bind zz           align-center
bind zt           align-top
bind zb           align-bottom

# Selecting and copying. y is only a command once something is selected;
# otherwise it is the first half of yy, exactly as in vim.
bind v            visual
bind V            visual-line
bind yy           yank-line
bind-visual y     yank
bind-visual v     visual
bind-visual V     visual-line
bind-visual <Esc> cancel

# search; / and ? preview as you type and Tab switches what Enter does
bind /            search-forward
bind ?            search-backward
bind n            search-next
bind N            search-prev
bind *            search-word
bind '#'          search-word-back

# rules
bind '&'          filter-only
bind !            filter-never
bind '\'          filter-bypass
bind <C-p>        filter-pop
bind <C-x>        filter-clear
bind =            filter-list
bind m            highlight
bind M-*          highlight-clear

# view
bind F            follow-toggle
bind zw           wrap-toggle
bind zn           line-numbers-toggle
bind zs           status-toggle
bind zr           reload
bind <C-l>        redraw
bind S            save-view

# other
bind :            command
bind <F1>         help
bind ZZ           quit
bind q            quit
bind <C-c>        quit
bind <Esc>        cancel

# ---------------------------------------------------------------------- styles

style default          default
style gutter           fg=#585858
style truncated        fg=#af5f5f bold
style status           fg=#d0d0d0 bg=#303030
style status.busy      fg=#000000 bg=#d7af00
style status.error     fg=#ffffff bg=#870000 bold
style status.key       fg=#87d7ff bg=#303030 bold
style prompt           fg=#ffffff bg=#005f87
style overlay          fg=#d0d0d0 bg=#1c1c1c
style overlay.title    fg=#ffffff bg=#1c1c1c bold
style overlay.key      fg=#87d7ff bg=#1c1c1c
style overlay.dim      fg=#808080 bg=#1c1c1c
style match            fg=#000000 bg=#ffd75f
style match.current    fg=#000000 bg=#ff8700 bold

style syntax.time      fg=#5f87af
style syntax.date      fg=#5f87af
style syntax.subsystem fg=#87d7af
style syntax.host      fg=#af87d7
style syntax.pid       fg=#5f8787
style syntax.number    fg=#af875f
style syntax.string    fg=#87af87
style syntax.key       fg=#5fafaf
style syntax.path      fg=#87afd7
style syntax.ip        fg=#d7875f
style syntax.uuid      fg=#8787af
style syntax.punct     fg=#585858
style syntax.trace     fg=#d78787

style syntax.level.debug  fg=#8a8a8a
style syntax.level.info   fg=#5fafd7
style syntax.level.notice fg=#5fd7af
style syntax.level.warn   fg=#d7af00 bold
style syntax.level.error  fg=#ff5f5f bold
style syntax.level.fatal  fg=#ffffff bg=#870000 bold

# Shown while a pattern is being typed, over the lines it would act on.
style preview.dropped  fg=#585858
style preview.kept     fg=#d0d0d0

style cursor.line      bg=#262626
style selection        fg=#ffffff bg=#005f87

# -------------------------------------------------------------------- profiles
#
# Rules are applied in order and later rules win where they overlap, so broad
# patterns come first and specific ones last.

profile kernel {
    match '*.dmesg' 'dmesg*' 'kern.log*' 'messages*'
    detect '^(<[0-9]+>)?\[[ ]*[0-9]+\.[0-9]+\]'

    rule '\b[0-9]+\b'                                        syntax.number
    rule '\b0x[0-9a-fA-F]+\b'                                syntax.number
    rule '\b[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]\b' syntax.host
    rule '\b[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}\b'            syntax.host
    rule '/[A-Za-z0-9_./+-]+'                                syntax.path
    rule '^(<[0-9]+>)'                                       syntax.punct group=1
    rule '\[[ ]*[0-9]+\.[0-9]+\]'                            syntax.time
    rule '\][ ]+([a-zA-Z0-9_][a-zA-Z0-9_.-]*):'              syntax.subsystem group=1
    rule '(?i)\b(deprecated|unsupported|timed? ?out|retry|retrying)\b' syntax.level.warn
    rule '(?i)\b(warn|warning)\b'                            syntax.level.warn
    rule '(?i)\b(error|err|failed|failure|cannot|unable)\b'  syntax.level.error
    rule '(?i)\b(bug|oops|panic|segfault|general protection|soft lockup|hung task)\b' syntax.level.fatal
    rule 'Call Trace:'                                       syntax.trace
    rule '^[ ]*\[<[0-9a-f]+>\]'                              syntax.trace
}

profile syslog {
    match 'syslog*' 'auth.log*' 'daemon.log*' 'mail.log*'
    detect '^[A-Z][a-z]{2}[ ]+[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} '

    rule '\b[0-9]+\b'                                        syntax.number
    rule '"[^"]*"'                                           syntax.string
    rule '/[A-Za-z0-9_./+-]+'                                syntax.path
    rule '\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b'                   syntax.ip
    rule '^[A-Z][a-z]{2}[ ]+[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}' syntax.time
    rule '^[A-Z][a-z]{2}[ ]+[0-9]{1,2} [0-9:]{8} (\S+)'      syntax.host group=1
    rule ' ([a-zA-Z0-9_./-]+)\['                             syntax.subsystem group=1
    rule '\[([0-9]+)\]'                                      syntax.pid group=1
    rule '(?i)\b(debug)\b'                                   syntax.level.debug
    rule '(?i)\b(info|notice)\b'                             syntax.level.info
    rule '(?i)\b(warn|warning)\b'                            syntax.level.warn
    rule '(?i)\b(error|err|failed|failure|denied|refused)\b' syntax.level.error
    rule '(?i)\b(crit|critical|alert|emerg|fatal|panic)\b'   syntax.level.fatal
}

profile iso {
    match '*.log' '*.log.[0-9]'
    detect '^[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}:[0-9]{2}'

    rule '\b[0-9]+\b'                                        syntax.number
    rule '"[^"]*"'                                           syntax.string
    rule '\b([a-zA-Z_][a-zA-Z0-9_.-]*)='                     syntax.key group=1
    rule '/[A-Za-z0-9_./+-]+'                                syntax.path
    rule '\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b'                   syntax.ip
    rule '\b[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}\b' syntax.uuid
    rule '^[0-9]{4}-[0-9]{2}-[0-9]{2}'                       syntax.date
    rule '[0-9]{2}:[0-9]{2}:[0-9]{2}([.,][0-9]+)?(Z|[+-][0-9]{2}:?[0-9]{2})?' syntax.time
    rule '\[([a-zA-Z0-9_.:/-]+)\]'                           syntax.subsystem group=1
    rule '(?i)\b(trace|debug|dbg)\b'                         syntax.level.debug
    rule '(?i)\b(info|information)\b'                        syntax.level.info
    rule '(?i)\b(notice)\b'                                  syntax.level.notice
    rule '(?i)\b(warn|warning)\b'                            syntax.level.warn
    rule '(?i)\b(error|err|failed|failure|exception)\b'      syntax.level.error
    rule '(?i)\b(fatal|critical|crit|panic|emerg)\b'         syntax.level.fatal
}

profile json {
    match '*.jsonl' '*.ndjson'
    detect '^[ \t]*\{.*"'

    rule '[][{}:,]'                                          syntax.punct
    rule '\b-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?\b'         syntax.number
    rule '\b(true|false|null)\b'                             syntax.number
    rule ':[ ]*"([^"\\]*(\\.[^"\\]*)*)"'                     syntax.string group=1
    rule '"([^"\\]*(\\.[^"\\]*)*)"[ ]*:'                     syntax.key group=1
    rule '"[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][^"]*"'             syntax.time
    rule '(?i)"(trace|debug)"'                               syntax.level.debug
    rule '(?i)"(info)"'                                      syntax.level.info
    rule '(?i)"(warn|warning)"'                              syntax.level.warn
    rule '(?i)"(error)"'                                     syntax.level.error
    rule '(?i)"(fatal|critical|panic)"'                      syntax.level.fatal
}

profile generic {
    rule '\b[0-9]+\b'                                        syntax.number
    rule '"[^"]*"'                                           syntax.string
    rule '\b([a-zA-Z_][a-zA-Z0-9_.-]*)='                     syntax.key group=1
    rule '/[A-Za-z0-9_./+-]+'                                syntax.path
    rule '\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b'                   syntax.ip
    rule '\b[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}\b' syntax.uuid
    rule '[0-9]{2}:[0-9]{2}:[0-9]{2}([.,][0-9]+)?'           syntax.time
    rule '[0-9]{4}-[0-9]{2}-[0-9]{2}'                        syntax.date
    rule '\[([a-zA-Z0-9_.:/-]+)\]'                           syntax.subsystem group=1
    rule '(?i)\b(trace|debug)\b'                             syntax.level.debug
    rule '(?i)\b(info)\b'                                    syntax.level.info
    rule '(?i)\b(notice)\b'                                  syntax.level.notice
    rule '(?i)\b(warn|warning)\b'                            syntax.level.warn
    rule '(?i)\b(error|err|failed|failure|exception|denied|refused)\b' syntax.level.error
    rule '(?i)\b(fatal|critical|crit|panic|emerg|segfault)\b' syntax.level.fatal
}
